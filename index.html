<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libro diario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 130vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background-image: url("imagenes/fondo.jpg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 105% 100%;
    }

    
    nav {
      background-color: #f8f7f852; /* semitransparente */
      padding: 5px;
      width: 12%;
      position: absolute;  
      top: 10px;               
      left: 10px;              
      border-radius: 10px;  
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-direction: column; 
      gap: 10px;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: rgba(247, 246, 248, 0.8);
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #d87093;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      color: rgb(250, 124, 208);
    }

    .carousel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-top: 20px;
    }

    .card {
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card img {
      width: 400px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
    }

    footer {
      margin-top: auto;
      background: linear-gradient(to right, #f5bfe7, #f89cd9);
      color: white;
      text-align: center;
      padding: 20px;  
      border-radius: 8px;
      width: 300px;
      height: 20px;
      margin: 60px auto 20px auto; 
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav>
    <ul>
      <li><a href="acerca.html">Acerca de</a></li>
      <li><a href="contacto.html">Contacto</a></li>
      
    </ul>
  </nav>

  <main>
    <h1>Mi Journal Book</h1>

    <div class="carousel">
      <div class="card">
        <img src="imagenes/dora.png" alt="Dorama" onclick="window.location.href='dorama.html'">
      </div>
      <div class="card">
        <img src="imagenes/peli.png" alt="Película" onclick="window.location.href='peli.html'">
      </div>
      <div class="card">
        <img src="imagenes/journ.png" alt="Journal" onclick="window.location.href='journal.html'">
      </div>
      <div class="card">
        <img src="imagenes/anim.png" alt="Anime" onclick="window.location.href='anime.html'">
      </div>
      <div class="card">
        <img src="imagenes/reseña.png" alt="Reseña" onclick="window.location.href='resena.html'">
      </div>
      <div class="card">
        <img src="imagenes/tienda.png" alt="Tienda" onclick="window.location.href='tienda.html'">
      </div>
    </div>

    <footer>
      <p>@ 2026 mi sitio web by RyO Studio</p>
    </footer>
  </main>
</body>
</html>
