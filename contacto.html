<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffe4e1; /* MistyRose */
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #d87093;
    }
    form {
      max-width: 400px;
      margin: 0 auto;
      background: #f7f2f2;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    }
    label {
      display: block;
      margin-top: 10px;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 15px;
      background: #d87093;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #c06080;
    }
    .volver-btn {
      display: block;
      margin: 20px auto;
      background: #d87093;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .volver-btn:hover {
      background: #c06080;
    }
  </style>
</head>
<body>

  <h1>📩 Contacto</h1>

  <form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required>

    <label for="mensaje">Comentario:</label>
    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

    <button type="submit">Enviar</button>
  </form>

  <!-- Botón para volver al menú principal -->
  <button class="volver-btn" onclick="window.location.href='index.html'">
    ⬅️ Volver al menú principal
  </button>

</body>
</html>
